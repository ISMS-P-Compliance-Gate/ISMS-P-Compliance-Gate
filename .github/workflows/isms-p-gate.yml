name: ISMS-P Compliance Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: write

env:
  # 기본 GITHUB_TOKEN은 repo 범위만 가짐. 조직 멤버/감사로그 조회(2.5.1), 브랜치 보호
  # 규칙 조회(2.8.5) 등은 repo-admin/org-read 권한이 있는 PAT가 필요할 수 있으므로,
  # ISMS_GATE_TOKEN 시크릿이 등록돼 있으면 그걸 우선 사용하고 없으면 기본 토큰을 쓴다.
  ISMS_TOKEN: ${{ secrets.ISMS_GATE_TOKEN || secrets.GITHUB_TOKEN }}
  GITHUB_ORG: ${{ github.repository_owner }}
  PR_NUMBER: ${{ github.event.pull_request.number }}
  GITLEAKS_REPORT_PATH: ${{ github.workspace }}/gitleaks-report.json

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      # =====================================================================
      # 공통 셋업 (강서윤 담당 - 파이프라인 오케스트레이션)
      # =====================================================================
      - name: "[강서윤] Checkout (full history)"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "[강서윤] Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "[강서윤] Install Python dependencies"
        run: pip install -r requirements.txt

      - name: "[강서윤] Install gitleaks"
        run: |
          set -e
          VERSION=8.18.4
          curl -sSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: "[강서윤] Run gitleaks (full git history) — 2.7.2 입력 생성"
        run: |
          gitleaks detect \
            --source . \
            --log-opts="--all" \
            --report-format json \
            --report-path "$GITLEAKS_REPORT_PATH" \
            --exit-code 0

      # =====================================================================
      # /강서윤 담당 — 2.5.1 / 2.6.3 / 2.7.2 / 2.8.2 / 2.8.5 / 2.8.6 / 2.9.1 (완료)
      # scanners/seoyun_pipeline/check_*.py
      # =====================================================================
      - name: "[강서윤] seoyun_pipeline 점검 실행"
        env:
          GITHUB_TOKEN: ${{ env.ISMS_TOKEN }}
          # 2.8.2(SonarQube)용. SONAR_PROJECT_KEY/SONAR_TOKEN은 리포 Settings > Secrets and
          # variables > Actions에 등록 필요. 등록 전까지는 2.8.2가 ERROR로 남는다(정상 동작).
          SONAR_HOST_URL: https://sonarcloud.io
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          shopt -s nullglob
          for f in scanners/seoyun_pipeline/check_*.py; do
            echo "::group::$f"
            python "$f" || echo "::warning file=$f::점검 스크립트 실행 실패 (ERROR로 기록됨)"
            echo "::endgroup::"
          done

      # =====================================================================
      # /혜민 담당 — 2.7.1 / 2.8.4 (완료)
      # scanners/hyemin_scanner/check_*.py
      # =====================================================================
      - name: "[혜민] hyemin_scanner 점검 실행"
        env:
          GITHUB_TOKEN: ${{ env.ISMS_TOKEN }}
        run: |
          # ---- 2.7.1 (testssl.sh) 준비 ----
          sudo apt-get update -y
          sudo apt-get install -y dnsutils bsdmainutils
          if [ ! -f "./testssl.sh/testssl.sh" ]; then
            git clone --depth 1 https://github.com/drwetter/testssl.sh.git ./testssl.sh
          fi

          # ---- 2.8.4 (Presidio) 준비 ----
          python -m spacy download en_core_web_lg

          shopt -s nullglob
          for f in scanners/hyemin_scanner/check_*.py; do
            echo "::group::$f"
            python "$f" || echo "::warning file=$f::점검 스크립트 실행 실패 (ERROR로 기록됨)"
            echo "::endgroup::"
          done

      # =====================================================================
      # /민지 담당 — 2.2.5 / 2.5.2 / 2.5.3 / 2.5.4 / 2.5.5 / 2.5.6 (IAM, 완료)
      # scanners/minji_iam/check_*.py
      # =====================================================================
      - name: "[민지] minji_iam 점검 실행"
        env:
          GITHUB_TOKEN: ${{ env.ISMS_TOKEN }}
          # 2.5.5/2.5.6(AWS IAM API)용. 리포 Settings > Secrets and variables > Actions에
          # AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / AWS_DEFAULT_REGION 등록 필요.
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
        run: |
          shopt -s nullglob
          for f in scanners/minji_iam/check_*.py; do
            echo "::group::$f"
            python "$f" || echo "::warning file=$f::점검 스크립트 실행 실패 (ERROR로 기록됨)"
            echo "::endgroup::"
          done

      # =====================================================================
      # /예원 담당 — 2.6.1 / 2.6.2 / 2.6.4 / 2.6.6 / 2.6.7 / 2.8.3 / 2.10.1 / 2.10.2 (Infra, 완료)
      # scanners/yewon_infra/check_*.py
      # 2.6.1(hcl2 파싱), 2.10.2(checkov)는 scanners/terraform/test.tf 샘플을 대상으로 함
      # =====================================================================
      - name: "[예원] yewon_infra 점검 실행"
        env:
          GITHUB_TOKEN: ${{ env.ISMS_TOKEN }}
          TF_DIR: scanners/terraform
          # 2.6.4/2.10.1(AWS API)용. 리포 Settings > Secrets and variables > Actions에
          # AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / AWS_DEFAULT_REGION 등록 필요.
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
        run: |
          shopt -s nullglob
          for f in scanners/yewon_infra/check_*.py; do
            echo "::group::$f"
            python "$f" || echo "::warning file=$f::점검 스크립트 실행 실패 (ERROR로 기록됨)"
            echo "::endgroup::"
          done

      # =====================================================================
      # /정은 담당 — 2.9.2 / 2.9.3 / 2.9.4 / 2.9.5 / 2.9.6 / 2.10.9 (Ops, 완료)
      # scanners/jeongeun_ops/check_*.py
      # =====================================================================
      - name: "[정은] jeongeun_ops 점검 실행"
        env:
          GITHUB_TOKEN: ${{ env.ISMS_TOKEN }}
        run: |
          shopt -s nullglob
          for f in scanners/jeongeun_ops/check_*.py; do
            echo "::group::$f"
            python "$f" || echo "::warning file=$f::점검 스크립트 실행 실패 (ERROR로 기록됨)"
            echo "::endgroup::"
          done

      # =====================================================================
      # 아티팩트 업로드 (강서윤 담당) — 각 스캐너가 저장한 results/*.json 원본을
      # 그대로 업로드. 여러 항목을 하나로 합치는 집계는 아래 별도 담당 파트.
      # =====================================================================
      - name: "[강서윤] Upload results artifact"
        uses: actions/upload-artifact@v4
        with:
          name: isms-p-results
          path: results/

      # =====================================================================
      # 결과 집계 (results/{control_id}/*.json -> summary)
      # scripts/aggregate_results.py는 존재하지만 현재 IndentationError로 실행 불가.
      # 스크립트 수정 전까지는 이 스텝을 주석 해제하지 마세요.
      # =====================================================================
      # - name: "Aggregate results"
      #   run: python scripts/aggregate_results.py

      # =====================================================================
      # /혜민 담당 — PR 코멘트 (results/ 아래 각 점검 결과를 모아 PR에 upsert 코멘트)
      # =====================================================================
      - name: "[혜민] Post PR comment"
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/post_pr_comment.py

      # =====================================================================
      # 참고용 보관 — 위 "[혜민] Post PR comment" 스텝이 lib/remediation.py의
      # generate_comments()를 이미 내부에서 호출하므로 평소엔 필요 없음(중복 실행 +
      # Gemini 이중 호출 + 실패 시 잡 전체 실패 위험). remediation.py만 별도로
      # 단독 실행해서 결과를 확인해야 할 때만 주석 해제해서 쓸 것.
      # =====================================================================
      # - name: Install dependencies
      #   run: pip install -r requirements.txt
      #
      # - name: Run ISMS-P remediation comment generation
      #   env:
      #     GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      #     GEMINI_MODEL: gemini-2.0-flash   # 선택, 없으면 코드 기본값 사용
      #   run: python lib/remediation.py
